[project]
name = "lunziko-ai-engine"
version = "0.1.0"
description = "Lunziko AI Engine — IA autonome (gateway, providers, mémoire, RAG, agents, voix). Indépendant de Lunziko Platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Lunziko" }
authors = [{ name = "Jaise Buka Dilu" }]

# Cœur autonome : démarre et fonctionne SANS aucune dépendance à Platform.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",            # appels providers cloud (REST direct, pas de SDK lourd)
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Ajoutés phase par phase — jamais requis pour démarrer le gateway.
vector = ["numpy>=1.26", "sqlite-vec>=0.1"]          # VectorPort local performant
local  = ["llama-cpp-python>=0.3", "onnxruntime>=1.18"]  # providers locaux (A-1+)
voice  = ["kokoro>=0.9", "faster-whisper>=1.0", "sherpa-onnx>=1.10", "ctranslate2>=4.3"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"] # adaptateur optionnel (couplage Platform)
secure = ["cryptography>=43"]                         # mémoire chiffrée AES-256-GCM
# Système neuronal : bibliothèques importées à la demande (jamais requises pour démarrer).
# Licences permissives (PyTorch BSD, TF/Keras/JAX/Transformers Apache-2.0, scikit-learn BSD).
neural = ["numpy>=1.26", "scikit-learn>=1.4"]         # backend ML classique (routeur d'intention)
neural-deep = ["torch>=2.2"]                          # réseaux profonds + GPU (optionnel)
neural-hf = ["transformers>=4.44", "sentence-transformers>=3.0"]  # modèles pré-entraînés (rerank/embeddings)
search = ["ddgs>=6"]                                  # recherche web sans clé (DuckDuckGo)
voice-stt = ["faster-whisper>=1.0"]                   # STT Whisper (V-1) — modèle téléchargé au 1er usage
dev = ["pytest>=8", "ruff>=0.6", "ddgs>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
